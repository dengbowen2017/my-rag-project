name: Milestone Release

on:
  push:
    tags:
      - 'v0[0-9]'
      - 'v1[01]'

permissions:
  contents: read

jobs:
  release:
    name: Publish milestone release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is in main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MILESTONE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$MILESTONE_TAG" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$MILESTONE_TAG" --verify-tag --generate-notes --title "Milestone $MILESTONE_TAG"
